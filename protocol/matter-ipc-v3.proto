syntax = "proto2";
package microhad;
// Field numbers are permanent. Removed numbers must be reserved.
// Optional scalars preserve explicit zero/false; semantic presence is validated by adapters.
message MatterStatusRequest {
}
message ThreadStatusRequest {
}
message CommissioningStartRequest {
  optional uint32 schema = 1;
  optional uint32 discriminator = 2;
  optional uint32 pin = 3;
  optional uint32 timeout_seconds = 4;
  optional string country_code = 5;
  optional string regulatory_location = 6;
}
message CommissioningStatusRequest {
  optional uint32 schema = 1;
  optional uint64 session = 2;
  optional bool subscribe = 3;
}
message CommissioningCancelRequest {
  optional uint32 schema = 1;
  optional uint64 session = 2;
}
message BleAttachRequest {
  optional uint32 schema = 1;
  optional uint64 session = 2;
  optional bytes address = 3;
  optional uint32 mtu = 4;
}
message BleIndicationRequest {
  optional uint32 schema = 1;
  optional uint64 session = 2;
  optional uint32 generation = 3;
  optional uint32 sequence = 4;
  optional bytes data = 5;
}
message BleWriteCompleteRequest {
  optional uint32 schema = 1;
  optional uint64 session = 2;
  optional uint32 generation = 3;
  optional uint32 write = 4;
  optional bool success = 5;
}
message ThreadControlRequest {
  optional uint32 schema = 1;
  optional string action = 2;
  optional bool subscribe = 3;
  optional uint32 zigbee_channel = 4;
  optional bool zigbee_online = 5;
  optional bytes dataset = 6;
}
message DeviceControlRequest {
  optional uint32 schema = 1;
  optional string action = 2;
  optional uint32 cursor = 3;
  optional uint64 revision = 4;
  optional uint64 node = 5;
  optional uint32 endpoint = 6;
  optional uint32 cluster = 7;
  optional uint32 attribute = 8;
  optional uint64 job = 9;
  optional BindingTargetList targets = 10;
  optional bool local = 11;
  optional bool restore = 12;
}
message DeviceCommandRequest {
  optional uint32 schema = 1;
  optional uint64 node = 2;
  optional uint32 endpoint = 3;
  optional string command = 4;
  optional uint32 level = 5;
  optional uint32 transition_deciseconds = 6;
  optional string field = 7;
  optional string value = 8;
  optional string time_zone = 9;
  optional sint64 offset_seconds = 10;
}
message OperationResponse {
  optional uint32 schema = 1;
  optional bool ok = 2;
  optional string error = 3;
  optional OperationResult result = 4;
}
message EventNotification {
  optional uint32 schema = 1;
  optional string event = 2;
  optional EventPayload data = 3;
}
message MatterStatus {
  optional bool enabled = 1;
  optional bool available = 2;
  optional bool controller_initialized = 3;
  optional bool fabric_ready = 4;
  optional string state = 5;
  optional uint64 commissioning_session = 6;
}
message ThreadStatus {
  optional bool enabled = 1;
  optional bool available = 2;
  optional bool configured = 3;
  optional bool attached = 4;
  optional string state = 5;
  optional bool linux_ipv6_or_tun = 6;
  optional uint32 zigbee_channel = 7;
  optional uint32 dataset_channel = 8;
}
message CommissioningSession {
  optional uint64 session = 1;
  optional string state = 2;
  optional uint32 deadline_remaining_seconds = 3;
  optional string error = 4;
  optional uint64 node = 5;
}
message BleAttachResult {
  optional uint32 generation = 1;
}
message BleIndicationResult {
  optional uint32 sequence = 1;
}
message BleWriteCompleteResult {
  optional uint32 write = 1;
}
message DeviceSnapshotPage {
  optional uint64 revision = 1;
  optional MatterDeviceList devices = 2;
  optional NullableUint next_cursor = 3;
}
message MatterDevice {
  optional uint64 node = 1;
  optional string state = 2;
  optional bool online = 3;
  optional NullableText id = 4;
  optional NullableUint endpoint = 5;
  optional UInt32List servers = 6;
  optional UInt32List clients = 7;
  optional string manufacturer = 8;
  optional string model = 9;
  optional NullableInt rssi_dbm = 10;
  optional UInt32List device_types = 11;
}
message DeviceOperationJob {
  optional uint64 job = 1;
  optional string state = 2;
  optional string error = 3;
  optional AttributeReading result = 4;
}
message AttributeReading {
  optional uint64 node = 1;
  optional uint32 endpoint = 2;
  optional uint32 cluster = 3;
  optional uint32 attribute = 4;
  optional AttributeValue value = 5;
}
message AttributeValue {
  optional string type = 1;
  optional ReadingValue value = 2;
}
message Measurement {
  optional MeasurementValue value = 1;
  optional string unit = 2;
  optional string quality = 3;
  optional uint32 mode = 4;
  optional ThermostatTransitionList transitions = 5;
}
message BleWriteEvent {
  optional uint64 session = 1;
  optional uint32 generation = 2;
  optional uint32 write = 3;
  optional bytes data = 4;
}
message ButtonEvent {
  optional uint64 node = 1;
  optional uint32 endpoint = 2;
  optional uint32 event = 3;
  optional uint32 position = 4;
  optional uint32 press_count = 5;
}
message BindingTarget {
  optional uint64 node = 1;
  optional NullableUint endpoint = 2;
  optional NullableUint group = 3;
  optional BindingMemberList members = 4;
  optional uint32 cluster = 5;
}
message BindingMember {
  optional uint64 node = 1;
  optional uint32 endpoint = 2;
}
message InventoryRecord {
  optional string kind = 1;
  optional MatterDevice device = 2;
  optional uint32 endpoint_count = 3;
}
message InventoryNodeManifest {
  optional InventoryNodeList nodes = 1;
}
message InventoryNode {
  optional uint64 node = 1;
}
message SubscriptionHealth {
  optional uint64 node = 1;
  optional bool restore_scheduled = 2;
  optional bool intermittent = 3;
  optional string reachability = 4;
  optional NullableUint next_cursor = 5;
  optional SubscriptionList subscriptions = 6;
}
message Subscription {
  optional uint32 endpoint = 1;
  optional uint32 cluster = 2;
  optional uint32 attribute = 3;
  optional NullableUint id = 4;
  optional uint32 max_interval_seconds = 5;
  optional NullableUint last_report_age_seconds = 6;
  optional uint32 retry_in_seconds = 7;
  optional uint32 failures = 8;
  optional string state = 9;
}
message ThermostatSchedule {
  optional uint32 mode = 1;
  optional ThermostatTransitionList transitions = 2;
}
message ThermostatTransition {
  optional uint32 time = 1;
  optional double heat = 2;
  optional double cool = 3;
}
message MeasurementValue {
  oneof choice {
    bool null = 1;
    double number = 2;
    sint64 integer = 3;
    string text = 4;
  }
}
message NullableText {
  oneof choice {
    bool null = 1;
    string text = 2;
  }
}
message NullableUint {
  oneof choice {
    bool null = 1;
    uint64 integer = 2;
  }
}
message NullableInt {
  oneof choice {
    bool null = 1;
    sint64 integer = 2;
  }
}
message ReadingValue {
  oneof choice {
    bool null = 1;
    bool boolean = 2;
    uint64 unsigned = 3;
    sint64 integer = 4;
    double number = 5;
    string text = 6;
    Measurement measurement = 7;
    ThermostatCapabilityList list = 8;
  }
}
message OperationResult {
  oneof choice {
    CommissioningSession session = 1;
    BleAttachResult ble_attach_result = 2;
    BleIndicationResult ble_indication_result = 3;
    BleWriteCompleteResult ble_write_complete_result = 4;
    ThreadStatus thread = 5;
    DeviceSnapshotPage page = 6;
    DeviceOperationJob job = 7;
    SubscriptionHealth subscription_health = 8;
  }
}
message EventPayload {
  oneof choice {
    ThreadStatus thread = 1;
    CommissioningSession session = 2;
    BleWriteEvent ble_write = 3;
    AttributeReading reading = 4;
    ButtonEvent button = 5;
    InventoryRecord inventory = 6;
    InventoryNodeManifest inventory_nodes = 7;
  }
}
message MessageBody {
  oneof choice {
    MatterStatusRequest matter_status_request = 1;
    ThreadStatusRequest thread_status_request = 2;
    CommissioningStartRequest commissioning_start_request = 3;
    CommissioningStatusRequest commissioning_status_request = 4;
    CommissioningCancelRequest commissioning_cancel_request = 5;
    BleAttachRequest ble_attach_request = 6;
    BleIndicationRequest ble_indication_request = 7;
    BleWriteCompleteRequest ble_write_complete_request = 8;
    ThreadControlRequest thread_control_request = 9;
    DeviceControlRequest device_control_request = 10;
    DeviceCommandRequest device_command_request = 11;
    MatterStatus matter = 12;
    ThreadStatus thread = 13;
    OperationResponse reply = 14;
    EventNotification event = 15;
  }
}
message ThermostatCapabilityList { repeated uint32 items = 1; }
message IpcEnvelope {
  optional uint32 version = 1;
  optional uint32 kind = 2;
  optional uint32 opcode = 3;
  optional uint32 id = 4;
  optional MessageBody body = 5;
}
message BindingTargetList { repeated BindingTarget items = 1; }
message MatterDeviceList { repeated MatterDevice items = 1; }
message UInt32List { repeated uint32 items = 1; }
message ThermostatTransitionList { repeated ThermostatTransition items = 1; }
message BindingMemberList { repeated BindingMember items = 1; }
message InventoryNodeList { repeated InventoryNode items = 1; }
message SubscriptionList { repeated Subscription items = 1; }
