syntax = "proto2";
package microhad;
// RAM cache only; never used for saved device configuration.
message DeviceCache { optional uint32 version = 1; repeated CachedDevice devices = 2; }
message CachedDevice {
  optional string ieee_address = 1;
  optional string source = 2;
  optional string external_id = 3;
  optional string component = 4;
  optional string name = 5;
  optional string kind = 6;
  optional string air_quality = 7;
  optional string co2_unit = 8;
  optional string pm25_unit = 9;
  optional string manufacturer_name = 10;
  optional string model_id = 11;
  optional string software_build_id = 12;
  optional string configured_signature = 13;
  optional string thermostat_source_id = 14;
  optional string matter_state = 15;
  optional string matter_metadata_state = 16;
  optional string matter_node = 17;
  optional bool contact_open = 18;
  optional bool has_contact = 19;
  optional bool contact_known = 20;
  optional bool has_water_leak = 21;
  optional bool water_leak_known = 22;
  optional bool water_detected = 23;
  optional bool has_temperature = 24;
  optional bool temperature_known = 25;
  optional bool has_humidity = 26;
  optional bool humidity_known = 27;
  optional bool has_air_quality = 28;
  optional bool air_quality_known = 29;
  optional bool has_co2 = 30;
  optional bool co2_known = 31;
  optional bool has_pm25 = 32;
  optional bool pm25_known = 33;
  optional bool has_occupancy = 34;
  optional bool occupied = 35;
  optional bool has_battery = 36;
  optional bool has_wifi_signal = 37;
  optional bool has_light = 38;
  optional bool light_on = 39;
  optional bool light_known = 40;
  optional bool has_brightness = 41;
  optional bool brightness_known = 42;
  optional bool has_remote = 43;
  optional bool has_actor = 44;
  optional bool actor_known = 45;
  optional bool actor_on = 46;
  optional bool has_power = 47;
  optional bool power_known = 48;
  optional bool has_low_temperature_alert = 49;
  optional bool has_high_temperature_alert = 50;
  optional bool contact_trigger_mode = 51;
  optional bool initial_interview_complete = 52;
  optional sint64 network_address = 53;
  optional sint64 battery_percent = 54;
  optional sint64 link_quality = 55;
  optional sint64 wifi_signal_percent = 56;
  optional sint64 brightness_percent = 57;
  optional sint64 last_seen = 58;
  optional sint64 ias_zone_id = 59;
  optional sint64 contact_initial_alert_minutes = 60;
  optional sint64 contact_reminder_alert_minutes = 61;
  optional sint64 contact_trigger_cooldown_seconds = 62;
  optional sint64 sensor_refresh_interval_minutes = 63;
  optional sint64 thermostat_stale_minutes = 64;
  optional sint64 matter_endpoint = 65;
  optional double temperature_celsius = 66;
  optional double humidity_percent = 67;
  optional double co2_ppm = 68;
  optional double pm25_micrograms_m3 = 69;
  optional double power_watts = 70;
  optional double low_temperature_alert = 71;
  optional double high_temperature_alert = 72;
  repeated CachedEndpoint endpoint_descriptors = 100;
  optional bytes node_descriptor = 101;
  repeated uint32 matter_servers = 102;
  repeated uint32 matter_clients = 103;
  repeated uint32 matter_device_types = 104;
  repeated CachedAlert alerts = 105;
}
message CachedEndpoint { optional uint32 endpoint = 1; optional uint32 profile_id = 2; optional uint32 device_id = 3; repeated uint32 input_clusters = 4; repeated uint32 output_clusters = 5; optional uint32 device_version = 6; }
message CachedAlert { optional string name = 1; optional bool has_low = 2; optional bool has_high = 3; optional double low = 4; optional double high = 5; optional double hysteresis = 6; optional string unit = 7; }
