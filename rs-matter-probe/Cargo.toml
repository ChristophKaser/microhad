[package]
name = "lexra-rs-matter-probe"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
default = []
openthread = ["dep:embassy-time-queue-utils"]
controller-probe = ["openthread", "dep:embassy-futures", "dep:static_cell", "dep:heapless"]
controller-service = ["openthread", "control-ipc", "dep:static_cell", "dep:libc", "dep:heapless", "dep:embassy-futures"]
control-ipc = ["dep:serde", "dep:serde_json"]

[dependencies]
rs-matter = { path = "../build/rs-matter/probe-source/rs-matter", default-features = false, features = ["rustcrypto"] }
critical-section = { version = "1.2", features = ["std"] }
embassy-time = { version = "0.5", features = ["std"] }
embassy-time-queue-utils = { version = "0.3", features = ["generic-queue-64"], optional = true }

embassy-futures = { version = "0.1", optional = true }
static_cell = { version = "2", optional = true }
heapless = { version = "0.9", optional = true }
libc = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[profile.release]
panic = "abort"
opt-level = "z"
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 2

[[bin]]
name = "ot-matter-transport-probe"
path = "src/bin/ot_transport.rs"
required-features = ["openthread"]

[[bin]]
name = "ot-matter-commissioning-probe"
path = "src/bin/ot_commissioning.rs"
required-features = ["controller-probe"]

[[bin]]
name = "thread-matter"
path = "src/bin/service.rs"
required-features = ["controller-service"]
