[package]
name = "micro-thread-matter-daemon"
version = "0.1.0"
edition = "2021"
publish = false

default-run = "mthread-matter"

[workspace]

[features]
default = []
openthread = ["dep:embassy-time-queue-utils"]
controller-probe = ["controller-service", "dep:embassy-futures", "dep:static_cell", "dep:heapless"]
controller-service = ["openthread", "control-ipc", "controller-identity", "dep:static_cell", "dep:libc", "dep:heapless", "dep:embassy-futures"]
controller-service-test-hooks = ["controller-service"]
controller-identity = ["dep:zeroize"]
control-ipc = ["dep:zeroize"]

[dependencies]
ciborium = "=0.2.2"

rs-matter = { path = "../build/micro-thread-matter-daemon/service-source/rs-matter", default-features = false, features = ["rustcrypto"] }
critical-section = { version = "1.2", features = ["std"] }
embassy-time = { version = "0.5", features = ["std"] }
embassy-time-queue-utils = { version = "0.3", features = ["generic-queue-64"], optional = true }

embassy-futures = { version = "0.1", optional = true }
static_cell = { version = "2", optional = true }
heapless = { version = "0.9", optional = true }
libc = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
zeroize = { version = "1", optional = true }

[profile.release]
panic = "abort"
opt-level = "z"
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 2

[[bin]]
name = "ot-matter-transport-probe"
path = "src/bin/ot_transport.rs"
required-features = ["openthread"]

[[bin]]
name = "ot-matter-commissioning-probe"
path = "src/bin/ot_commissioning.rs"
required-features = ["controller-probe"]

[[bin]]
name = "mthread-matter"
path = "src/bin/service.rs"
required-features = ["controller-service"]

[target.'cfg(all(target_arch = "mips", target_env = "uclibc"))'.dependencies]
ziggurat-stock-uclibc-compat = { path = "../ziggurat/stock-uclibc-compat" }
