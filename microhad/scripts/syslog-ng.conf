@version: 4.10

source s_gateway_udp {
    network(ip("0.0.0.0") port(7878) transport("udp"));
};

destination d_gateway_logs {
    file("/var/log/livelogs/gateway.log"
         perm(0644)
         dir-perm(0755)
         logrotate(enable(yes), size(100MB), rotations(50)));
};

log {
    source(s_gateway_udp);
    destination(d_gateway_logs);
};

# Preserve crash and timing evidence independently of high-volume packet capture.
filter f_gateway_events {
    level(warn..emerg) or
    match("Matter controller service (started|stopped)|MATTER_LOOP|COORDINATOR_SLOW|MATTER_SLOW" value("MESSAGE"));
};
destination d_gateway_events {
    file("/var/log/livelogs/gateway-events.log"
         perm(0644)
         dir-perm(0755)
         logrotate(enable(yes), size(10MB), rotations(50)));
};
log {
    source(s_gateway_udp);
    filter(f_gateway_events);
    destination(d_gateway_events);
};
